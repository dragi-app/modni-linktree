name: Публікація MODNI Linktree

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  NEXT_PUBLIC_BASE_PATH: /modni-linktree
  NEXT_PUBLIC_SITE_URL: https://dragi-app.github.io/modni-linktree

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Отримати код
        uses: actions/checkout@v6

      - name: Підготувати Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Встановити залежності
        run: npm ci

      - name: Перевірити код
        run: npm run lint

      - name: Зібрати статичний сайт
        run: npm run build:pages

      - name: Налаштувати GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Завантажити сайт
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Опублікувати сайт
        id: deployment
        uses: actions/deploy-pages@v4
